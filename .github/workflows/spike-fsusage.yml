# The privileged leg of the fs_usage survey (#286, route F1), run where sudo
# needs no human: GitHub's macOS runner. This is a measurement apparatus, not
# standing CI — it triggers only on its own spike branch and by hand, and it
# must never be made a required check.
#
# The F12 fail-fast (2026-08-24, run 32686422118) already measured the
# premise: sudo -n rc=0, fs_usage rc=0, 27,994 lines in 2 seconds, the marker
# touch visible. What follows is the full survey on top of that ground.
name: spike-fsusage
on:
  push:
    branches: [fsusage-oracle-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sudo-fsusage:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Pinned by commit, like every action in this repository (ADR 0061,
      # spike/check-action-pins.sh). These three were pinned first, when the
      # reason was local to this file — they run before a script that runs as
      # root — and the rule now covers the whole set rather than this one leg.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Build the shim (the trace it writes is the P2 ground truth)
        run: zig build

      - name: Unprivileged half (selftest, sabotage controls, the refusal)
        run: sh spike/fsusage/survey.sh

      - name: Privileged half (the four points, as root)
        run: |
          mkdir -p /tmp/fsu-out
          # -n: refuse rather than prompt if the runner's sudo ever stops being passwordless
          sudo -n OUT=/tmp/fsu-out SHIM="$PWD/zig-out/lib/libsideeye_shim.dylib" \
            sh spike/fsusage/sudo-survey.sh
          rc=$?
          echo "sudo-survey rc=$rc"
          exit "$rc"

      - name: Upload captures and accounts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fsusage-survey
          path: /tmp/fsu-out/
          if-no-files-found: warn
