name: stack-probe

# Temporary, for PR #880: which call of a worker thread reaches deepest under the shim built with
# Zig 0.16.0 and with 0.17.0, on one runner. Removed before the pull request merges.

on:
  push:
    branches: [auto/b_bfd27afcb3bd-782]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      - name: Build the shim with 0.17.0
        run: zig build && cp zig-out/lib/libsideeye_shim.so /tmp/s17.so

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Build main's shim with 0.16.0
        run: |
          git worktree add /tmp/base 977085e4437f6e39cf3737eaa29e107854c86cb1
          cd /tmp/base && zig version && zig build && cp zig-out/lib/libsideeye_shim.so /tmp/s16.so

      - name: Measure each call's reach, both shims, both modes
        shell: bash
        run: |
          cat > /tmp/probe.c <<'EOF'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <fcntl.h>
          #include <pthread.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/auxv.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <sys/uio.h>
          #include <unistd.h>
          extern char **environ;
          static char pa[4096], pb[4096], pd[4096];
          static char *const xargv[] = {"probe-exec", NULL};
          static struct iovec iov = {"y\n", 2};
          static unsigned char *lo;
          static size_t mark[16];
          static const char *names[16];
          static int nm;
          static inline unsigned char *sp(void) { unsigned char *s; __asm__ volatile("mov %%rsp, %0" : "=r"(s)); return s; }
          #define MARK(nm_, top) do { volatile unsigned char *q; for (q = lo; q < (top) && *q == 0xA5; q++) ; mark[nm] = (size_t)((top) - q); names[nm] = nm_; nm++; } while (0)
          static void *work(void *u) {
              (void)u;
              volatile unsigned char *top = sp() - 16, *q;
              for (q = lo; q < top; q++) *q = 0xA5;
              int n = open("/dev/null", O_RDONLY); MARK("open-ro", top);
              if (n >= 0) close(n); MARK("close-ro", top);
              int fd = open(pa, O_WRONLY | O_CREAT | O_TRUNC, 0644); MARK("open-w", top);
              write(fd, "x\n", 2); MARK("write", top);
              pwritev2(fd, &iov, 1, 2, 0); MARK("pwritev2", top);
              close(fd); MARK("close", top);
              rename(pa, pb); MARK("rename", top);
              unlink(pb); MARK("unlink", top);
              mkdir(pd, 0755); MARK("mkdir", top);
              rmdir(pd); MARK("rmdir", top);
              execve("/nonexistent/probe", xargv, environ); MARK("execve", top);
              return NULL;
          }
          int main(int argc, char **argv) {
              snprintf(pa, sizeof pa, "%s/a", argv[1]); snprintf(pb, sizeof pb, "%s/b", argv[1]); snprintf(pd, sizeof pd, "%s/d", argv[1]);
              size_t sz = 256 * 1024;
              lo = mmap(NULL, sz, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANONYMOUS | MAP_STACK, -1, 0);
              pthread_attr_t at; pthread_t t; pthread_attr_init(&at); pthread_attr_setstack(&at, lo, sz);
              pthread_create(&t, &at, work, NULL); pthread_join(t, NULL);
              printf("sigframe=%lu\n", getauxval(51));
              for (int i = 0; i < nm; i++) printf("%-9s %zu\n", names[i], mark[i]);
              return 0;
          }
          EOF
          gcc -O0 -o /tmp/probe /tmp/probe.c -lpthread
          lscpu | grep -E 'Model name|Flags' | sed 's/Flags:.*\(avx512f\).*/Flags: has avx512f/' | head -2
          for mode in bare wrappers syscalls; do
            for s in s16 s17; do
              [ "$mode" = bare ] && [ "$s" = s17 ] && continue
              d=$(mktemp -d)
              echo "=== $mode $s"
              case $mode in
                bare) /tmp/probe "$d" ;;
                wrappers) env LD_PRELOAD=/tmp/$s.so SIDEEYE_STATE_DIR="$d" SIDEEYE_TRACE_PATH="$d.bin" SIDEEYE_RUN_CGROUP=/sideeye-footprint-elsewhere /tmp/probe "$d" ;;
                syscalls) env LD_PRELOAD=/tmp/$s.so SIDEEYE_STATE_DIR="$d" SIDEEYE_TRACE_PATH="$d.bin" SIDEEYE_RUN_CGROUP=/sideeye-footprint-elsewhere SIDEEYE_OBSERVE=syscalls /tmp/probe "$d" ;;
              esac
            done
          done
