name: ci

on:
  push:
    branches: [main]
  pull_request:

# The point of running both operating systems is not coverage for its own sake. v0.1
# claims that the same scenario produces the same verdict on Linux and macOS, and the
# two use entirely different interposition mechanisms to get there. A green Linux job
# alone would leave that claim untested — and every macOS defect found so far was
# invisible on Linux, including three that produced plausible values rather than errors.

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Reported with --summary all so the count is visible. A suite that silently
      # collects a subset is green in exactly the same way as a complete one; that
      # happened here once, at 19 of 24.
      - name: Unit tests
        run: zig build test --summary all

      - name: Build engine and shim
        run: zig build

      - name: Install the completeness oracle
        run: sudo apt-get update && sudo apt-get install -y strace

      - name: Build the toy targets
        run: sh spike/build-toys.sh
        env:
          SIDEEYE_ROOT: ${{ github.workspace }}

      - name: Acceptance suite
        run: sh spike/acceptance.sh
        env:
          SIDEEYE_ROOT: ${{ github.workspace }}

      # The MCP adapter has its own suite. It was not wired in here when the adapter
      # merged, which left the whole surface without CI coverage — and two of its
      # checks turned out to be satisfiable by stale artifacts nobody re-ran it to see
      # (BUILDLOG 2026-08-12).
      - name: MCP acceptance suite
        run: sh spike/mcp-acceptance.sh
        env:
          SIDEEYE_ROOT: ${{ github.workspace }}

      # A sealed campaign whose own artifacts disagree produces verdicts that mean
      # nothing — campaign 2 sealed exactly that and had to be voided (BUILDLOG
      # 2026-08-14). The per-campaign checker existed only inside the campaign that
      # wrote it; this walks every campaign present, requires one, and fails when a
      # campaign seals invocations without carrying it forward.
      - name: Sealed campaigns are internally consistent
        run: sh spike/check-sealed-campaigns.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Unit tests
        run: zig build test --summary all

      - name: Build engine and shim
        run: zig build

      # The demo is also the release workflow's smoke test; macOS is where its
      # no-oracle path lives (a FAIL stands on its own evidence, so the demo needs
      # neither strace nor --allow-unverified). The Linux side is covered by
      # acceptance check 5 in the container.
      - name: sideeye demo finds the planted bug
        run: |
          set +e
          out=$(./zig-out/bin/sideeye demo 2>&1)
          rc=$?
          set -e
          echo "$out" | tail -25
          [ "$rc" = "1" ] || { echo "expected exit 1 from the demo, got $rc"; exit 1; }

      # An Apple-shipped platform binary can never be observed, but *how* it
      # refuses is OS-dependent — measured, not assumed: macOS 15 strips the
      # insertion silently (the run completes, no_shim_marker), while macOS 26's
      # dyld terminates the target over the arm64/arm64e mismatch
      # (recording_run_failed) — so the platform binary pins only the refusal
      # fact, exit 2 and never a verdict. (A hardened-runtime ad-hoc binary was
      # tried as the clause carrier and is OS-dependent in the other direction:
      # macOS 15 ignores the insertion, macOS 26 lets it through.) The macOS
      # clause (#10) is therefore pinned on the deterministic synthesis of
      # "the shim never initialised": a decoy dylib that never writes
      # shim_ready, handed to --shim — whether dyld loads it or not, the marker
      # cannot appear, on any OS. Predicates: exit 2, the machine token, the
      # macOS clause, and the JSON message appearing verbatim in the text.
      # Each predicate seen red once (BUILDLOG 2026-08-18).
      - name: The macOS refusal keeps its shape, and the clause is pinned
        run: |
          set +e
          d="${RUNNER_TEMP:-/tmp}/platform-binary-pin"
          mkdir -p "$d/state-apple" "$d/state"
          out=$(./zig-out/bin/sideeye explore --state "$d/state-apple" --operation /usr/bin/true --check /usr/bin/true --work "$d/work-apple" --json "$d/report-apple.json" 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out" | head -3
          [ "$rc" = "2" ] || { echo "expected exit 2 from an Apple platform binary, got $rc"; exit 1; }

          printf 'int main(void){return 0;}\n' > "$d/noop.c"
          zig cc -o "$d/noop" "$d/noop.c"
          printf 'int sideeye_decoy;\n' > "$d/decoy.c"
          zig cc -dynamiclib -o "$d/decoy.dylib" "$d/decoy.c"
          set +e
          out=$(./zig-out/bin/sideeye explore --state "$d/state" --operation "$d/noop" --check /usr/bin/true --shim "$d/decoy.dylib" --work "$d/work" --json "$d/report.json" 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out" | head -3
          [ "$rc" = "2" ] || { echo "expected exit 2 when the shim never initialises, got $rc"; exit 1; }
          printf '%s\n' "$out" > "$d/text.out"
          python3 - "$d" <<'EOF'
          import json, sys
          d = sys.argv[1]
          r = json.load(open(d + "/report.json"))
          if r.get("unknown_reason") != "no_shim_marker":
              sys.exit("unknown_reason is %r, wanted no_shim_marker" % r.get("unknown_reason"))
          msg = r.get("message")
          if not isinstance(msg, str) or "Apple-shipped platform binary" not in msg:
              sys.exit("the macOS clause is missing from the JSON message: %r" % msg)
          text = open(d + "/text.out").read()
          if msg not in text:
              sys.exit("the text report does not carry the JSON message verbatim")
          EOF
          echo "ok   the platform-binary refusal keeps its shape: exit 2, the token, the macOS clause, JSON message verbatim in the text"

      # No oracle here: DTrace is dead under SIP even as root, and the one oracle-shaped
      # candidate, fs_usage, is root-gated (measured, #181, spike/macos-oracle/). That is
      # why this job asserts FAIL rather than PASS — a counterexample is real whether or
      # not the account of the run was complete, while "no counterexample found" would
      # need a completeness check this platform does not provide by default.
      - name: Interposition works and finds the planted bug
        run: |
          set -eu
          mkdir -p /tmp/ci/state
          zig cc -o /tmp/ci/toy-bug -DBUGGY=1 spike/toys/toy.c

          set +e
          out=$(./zig-out/bin/sideeye explore \
            --state /tmp/ci/state \
            --setup "/tmp/ci/toy-bug init" \
            --operation "/tmp/ci/toy-bug rotate" \
            --shim "$PWD/zig-out/lib/libsideeye_shim.dylib" \
            --work /tmp/ci/work \
            --allow-unverified 2>&1)
          rc=$?
          set -e

          echo "$out"
          [ "$rc" = "1" ] || { echo "expected FAIL (exit 1), got $rc"; exit 1; }
          echo "$out" | grep -q "after  unlink" || { echo "crash point not named"; exit 1; }
          echo "$out" | grep -q "before rename" || { echo "next operation not named"; exit 1; }
          echo "$out" | grep -q "NOT VERIFIED" || { echo "weaker claim not labelled"; exit 1; }

      # Contract v8 parity: state writes through re-bound standard descriptors must be
      # counted identically on both platforms (exact numbers, not just the verdict —
      # F_GETPATH is a different resolution mechanism than /proc/self/fd, and the count
      # is where a platform-specific miss would show).
      - name: State writes through dup2'd standard descriptors are counted (v8)
        run: |
          set -eu
          rm -rf /tmp/ci-dup && mkdir -p /tmp/ci-dup/state
          zig cc -o /tmp/ci-dup/toy-fixed spike/toys/toy.c

          set +e
          out=$(TOY_DUP2=1 ./zig-out/bin/sideeye explore \
            --state /tmp/ci-dup/state \
            --setup "/tmp/ci-dup/toy-fixed init" \
            --operation "/tmp/ci-dup/toy-fixed rotate" \
            --shim "$PWD/zig-out/lib/libsideeye_shim.dylib" \
            --work /tmp/ci-dup/work \
            --allow-unverified 2>&1)
          rc=$?
          set -e

          [ "$rc" = "0" ] || { echo "expected PASS, got $rc"; echo "$out" | head -6; exit 1; }
          echo "$out" | grep -q "explored 13 worlds (crash points 12 + 1 baseline)" \
            || { echo "descriptor-borne writes not counted (want 12 + 1, matching Linux)"; echo "$out" | head -4; exit 1; }

      # The shim's own trace descriptor is a number a target can legally close.
      # Below the relocation floor a daemonize-style close sweep must not move the
      # verdict (this also pins that the relocation happened — an unrelocated trace
      # fd sits at 3 and would be swept); a sweep that does reach the channel must
      # end in refusal with the state file holding exactly what the target wrote,
      # never the shim's own trace records (measured on Linux before the guard).
      # kqueue stats as a FIFO on this platform, so TOY_ANONFD also runs here.
      - name: Descriptor hygiene sweeps and anon descriptors (v8)
        run: |
          set -eu
          rm -rf /tmp/ci-fd && mkdir -p /tmp/ci-fd/state
          zig cc -o /tmp/ci-fd/toy-fixed spike/toys/toy.c

          run_toy() {
            set +e
            out=$(env "$1" ./zig-out/bin/sideeye explore \
              --state /tmp/ci-fd/state \
              --setup "/tmp/ci-fd/toy-fixed init" \
              --operation "/tmp/ci-fd/toy-fixed rotate" \
              --shim "$PWD/zig-out/lib/libsideeye_shim.dylib" \
              --work /tmp/ci-fd/work \
              --allow-unverified 2>&1)
            rc=$?
            set -e
          }

          run_toy TOY_CLOSE_SWEEP=150
          [ "$rc" = "0" ] || { echo "sweep below the floor moved the verdict: $rc"; echo "$out" | head -4; exit 1; }
          echo "$out" | grep -q "explored 5 worlds (crash points 4 + 1 baseline)" \
            || { echo "sweep below the floor changed the count"; echo "$out" | head -4; exit 1; }

          rm -rf /tmp/ci-fd/state /tmp/ci-fd/work && mkdir -p /tmp/ci-fd/state
          run_toy TOY_CLOSE_SWEEP=1023
          [ "$rc" = "2" ] || { echo "sweep at the trace fd should refuse, got $rc"; echo "$out" | head -4; exit 1; }
          echo "$out" | grep -q "unresolvable_path" || { echo "refusal did not name the channel"; echo "$out" | head -4; exit 1; }
          printf 'key=2\n' | cmp -s - /tmp/ci-fd/state/key.json \
            || { echo "state file corrupted by the harness:"; od -c /tmp/ci-fd/state/key.json | head -3; exit 1; }

          rm -rf /tmp/ci-fd/state /tmp/ci-fd/work && mkdir -p /tmp/ci-fd/state
          run_toy TOY_ANONFD=1
          [ "$rc" = "0" ] || { echo "a kqueue descriptor moved the verdict: $rc"; echo "$out" | head -4; exit 1; }
          echo "$out" | grep -q "explored 5 worlds (crash points 4 + 1 baseline)" \
            || { echo "kqueue changed the count"; echo "$out" | head -4; exit 1; }

      # The parity claim, asserted rather than described: both platforms must reach the
      # same logical crash point out of the same number of operations.
      - name: Same crash point as Linux
        run: |
          set -eu
          rm -rf /tmp/ci2 && mkdir -p /tmp/ci2/state
          zig cc -o /tmp/ci2/toy-bug -DBUGGY=1 spike/toys/toy.c

          set +e
          out=$(./zig-out/bin/sideeye explore \
            --state /tmp/ci2/state \
            --setup "/tmp/ci2/toy-bug init" \
            --operation "/tmp/ci2/toy-bug rotate" \
            --shim "$PWD/zig-out/lib/libsideeye_shim.dylib" \
            --work /tmp/ci2/work \
            --allow-unverified 2>&1)
          set -e

          echo "$out" | grep -q "crash point 5 of 5" \
            || { echo "expected crash point 5 of 5 (matching Linux)"; echo "$out"; exit 1; }
          echo "$out" | grep -q "explored    6 worlds" \
            || { echo "expected 6 explored worlds (5 + baseline)"; echo "$out"; exit 1; }

      # Run the line the report prints, on the platform where checking it by hand went
      # wrong: the shell still had the variables exported from an earlier experiment, so
      # an inert command appeared to work. A clean `env` cannot be fooled that way.
      - name: The printed reproduce line reproduces
        run: |
          set -eu
          rm -rf /tmp/ci3 && mkdir -p /tmp/ci3/state
          zig cc -o /tmp/ci3/toy-bug -DBUGGY=1 spike/toys/toy.c

          out=$(./zig-out/bin/sideeye explore \
            --state /tmp/ci3/state \
            --setup "/tmp/ci3/toy-bug init" \
            --operation "/tmp/ci3/toy-bug rotate" \
            --shim "$PWD/zig-out/lib/libsideeye_shim.dylib" \
            --work /tmp/ci3/work \
            --allow-unverified 2>&1) || true

          line=$(echo "$out" | grep '^reproduce' | sed 's/^reproduce  *//; s/ <operation>$//')
          [ -n "$line" ] || { echo "no reproduce line printed"; echo "$out"; exit 1; }

          rm -rf /tmp/ci3/state && mkdir -p /tmp/ci3/state
          TOY_STATE=/tmp/ci3/state /tmp/ci3/toy-bug init

          set +e
          # Unquoted deliberately: `env` must receive the VAR=VALUE words separately,
          # exactly as a person pasting the line would.
          env -i TOY_STATE=/tmp/ci3/state $line /tmp/ci3/toy-bug rotate
          rc=$?
          set -e

          [ "$rc" = "137" ] || { echo "expected SIGKILL (137), got $rc"; echo "$line"; exit 1; }
          [ ! -f /tmp/ci3/state/key.json ] || { echo "key.json survived; the kill did not land"; exit 1; }
          [ -f /tmp/ci3/state/key.json.tmp ] || { echo "key.json.tmp missing; not the reported state"; exit 1; }

  # The timewarrior finding lives here as a replayed regression, not a recipe (#82):
  # every push to main and every pull request re-proves the FAIL/PASS pair across the fix — record the counterexample
  # on the pinned unpatched build, replay it FAIL, rebuild with the committed patch,
  # replay it PASS. Either leg alone can rot silently (a FAIL-only check cannot tell
  # "the bug is real" from "the replay is broken"; a PASS-only check cannot tell
  # "fixed" from "case no longer applies"), which is why the pair is the job.
  #
  # Scope, stated plainly: this is regression HYGIENE, not v1.0 criterion-1 progress —
  # ADR 0017's ordering requirement keeps the timewarrior finding at "discovered
  # automatically — partial", and #82's older amendment definitions are superseded by
  # that ADR. The novelty record for the finding is BUILDLOG 2026-08-12 (linked, not
  # restated). The exploration this job performs is not a #84 corpus trial — that
  # corpus is frozen, and check 12 counts trials from its own manifest.
  #
  # A future trace-contract bump does not break this job: the script re-records the
  # case under the new contract each run (the committed-case alternative would have
  # gone red instead). If legs go red, the script's own output carries the exit code
  # and unknown_reason — enough to tell apparatus breakage from a real regression.
  timew-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build engine and shim
        run: zig build

      - name: Install the toolchain the pinned timewarrior build needs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git ca-certificates cmake g++ make python3 strace

      - name: "Replay across the fix: record, FAIL unpatched, PASS patched (legs a-c)"
        run: LEGS=abc sh spike/dogfood-timew-replay.sh
        env:
          SIDEEYE_REPO: ${{ github.workspace }}

  # The development journal is a delivery artifact here, and it went unwritten for four
  # pull requests once because nothing asked for it. Now something asks: a PR that
  # changes code without touching BUILDLOG.md does not merge. The decision logic was
  # shown its red against a synthetic code-only changeset before being trusted.
  buildlog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changed code requires a BUILDLOG entry
        run: |
          # Three-dot: diff from the merge-base, so a base branch that moved ahead does
          # not smuggle its own file list into this PR's changed set.
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          printf 'changed files:\n%s\n' "$changed"
          if echo "$changed" | grep -qE '^(src/|shim/|spike/|build\.zig$|build\.zig\.zon$)'; then
            if ! echo "$changed" | grep -qx 'BUILDLOG.md'; then
              echo '::error::This PR changes code but not BUILDLOG.md.'
              echo 'BUILDLOG.md is the running decision log (newest first, "## YYYY-MM-DD — claim").'
              echo 'Write the entry before the PR: what was decided, what was measured, what went wrong.'
              exit 1
            fi
          fi
          echo 'ok: BUILDLOG requirement satisfied'
