name: ci

on:
  push:
    branches: [main]
  pull_request:

# The point of running both operating systems is not coverage for its own sake. v0.1
# claims that the same scenario produces the same verdict on Linux and macOS, and the
# two use entirely different interposition mechanisms to get there. A green Linux job
# alone would leave that claim untested — and every macOS defect found so far was
# invisible on Linux, including three that produced plausible values rather than errors.

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Reported with --summary all so the count is visible. A suite that silently
      # collects a subset is green in exactly the same way as a complete one; that
      # happened here once, at 19 of 24.
      - name: Unit tests
        run: zig build test --summary all

      - name: Build engine and shim
        run: zig build

      # #270's apparatus, plus the guard on the apparatus itself: -Dtest-seq-gap must
      # ADD libsideeye_shim_testgap and leave the shipped shim byte-identical. A build
      # option that leaked into the shipped artifact would make every other acceptance
      # leg measure the gap shim — a new guard silently blinding the old ones.
      #
      # What this comparison covers is the FLAG leaking in, never the shipped VALUE
      # (#365): an edit to build.zig's `test_seq_gap` literal lands in both arms and
      # leaves the shas matching. That literal is held by a unit test in
      # shim/src/common.zig instead. Byte-identical here means "the same source built
      # two ways" — any edit to the source moves both shas together, which is why a
      # differential check cannot stand in for an assertion about the value.
      - name: Build the gap-shim apparatus, shipped shim unchanged (#270)
        run: |
          sha_before=$(sha256sum zig-out/lib/libsideeye_shim.so | cut -d' ' -f1)
          zig build -Dtest-seq-gap
          sha_after=$(sha256sum zig-out/lib/libsideeye_shim.so | cut -d' ' -f1)
          test -f zig-out/lib/libsideeye_shim_testgap.so
          test "$sha_before" = "$sha_after"

      # #324's apparatus, under the same guard as #270's above: -Dtest-trace-cap must
      # ADD two engines with a lowered trace-read ceiling and leave the shipped engine
      # byte-identical. Two artifacts because the recording read exits before the world
      # read is reached, so one binary can only ever demonstrate the first branch. The
      # shipped cap is unreachable by any fixture — the engine unlinks the trace before
      # every run, and the only writer is the shim — so without these the refusal is
      # untested: its branches live in main.zig, whose refusals exit the process, which
      # no unit test can drive.
      #
      # Same blind spot as #270's step above, and the same fix (#365). This comparison
      # sees the flag, not the shipped value: editing `engineOptions(b, 0, 0, false)`
      # puts the new ceiling in both arms. A LOUD edit is caught elsewhere — at 64 bytes
      # every acceptance leg that drives the SHIPPED binary refuses on a trace that size,
      # which is most of the suite though not all of it, since four apparatus binaries are
      # driven by their own names — but a QUIET one is caught nowhere: 128 MiB clears every
      # toy trace, so acceptance passes, this step passes, and the released engine carries
      # a ceiling that disagrees with engine.max_trace_bytes. The unit test in src/main.zig
      # is the only thing that sees it. The quiet half is measured: with the literal at
      # 128 MiB this step stayed green while `zig build test` went red. The loud half is
      # read off spike/acceptance.sh, not run — acceptance needs the Linux container.
      - name: Build the trace-cap apparatus, shipped engine unchanged (#324)
        run: |
          sha_before=$(sha256sum zig-out/bin/sideeye | cut -d' ' -f1)
          zig build -Dtest-trace-cap
          sha_after=$(sha256sum zig-out/bin/sideeye | cut -d' ' -f1)
          test -x zig-out/bin/sideeye-testtracecap
          test -x zig-out/bin/sideeye-testtracecap-world
          test "$sha_before" = "$sha_after"

      # The ancestor probe (#358) needs its own invocation — folding it into the step
      # above would leave the new option unexercised — and asserts a property rather than
      # a difference. Both options keep their shipped value as a separate literal in
      # build.zig, so neither flag's default can reach a released binary; what a sha
      # comparison cannot see is an edit to that literal, which lands in both arms and
      # leaves them matching. Grepping the shipped artifact does see it. (Measured both
      # ways: flipping the flag's default leaves the shipped binary clean; editing the
      # literal puts the entry in it.)
      #
      # `grep -a` is belt and braces, not a fix for a measured failure: GNU grep and BSD
      # grep both exit 0 on a binary match, so plain `-q` would work on the runner. It is
      # here because some grep replacements (ugrep with `-I`, for one) skip binaries and
      # exit 1 on a match, which would make the shipped-side assertion pass for the wrong
      # reason. An earlier version of this comment claimed the plain form fails on the
      # runner and called that measured; the measurement had been taken through such a
      # replacement, not through the grep CI runs.
      - name: Build the ancestor probe, synthetic entry absent from the shipped engine (#358)
        run: |
          zig build
          ! grep -qa se-anc-probe zig-out/bin/sideeye
          zig build -Dtest-ancestor-probe
          test -x zig-out/bin/sideeye-ancprobe
          grep -qa se-anc-probe zig-out/bin/sideeye-ancprobe
          ! grep -qa se-anc-probe zig-out/bin/sideeye

      # The gap #256 was: three syscalls the oracle classified and the shim never
      # exported, sitting there since v0.1 because nothing compared the two lists.
      # The check runs here rather than inside a cohort's preflight — the existing
      # class-drift check lives in spike/cohort4/ and is reachable only from that
      # cohort's own script, which is why it could not have caught this one.
      - name: Every classified syscall is interposed or explained (#256)
        run: python3 spike/check-shim-coverage.py src/oracle.zig shim/src/linux.zig

      - name: Install the completeness oracle
        run: sudo apt-get update && sudo apt-get install -y strace

      - name: Build the toy targets
        run: sh spike/build-toys.sh
        env:
          SIDEEYE_ROOT: ${{ github.workspace }}

      - name: Acceptance suite
        run: sh spike/acceptance.sh
        env:
          SIDEEYE_ROOT: ${{ github.workspace }}

      # The MCP adapter has its own suite. It was not wired in here when the adapter
      # merged, which left the whole surface without CI coverage — and two of its
      # checks turned out to be satisfiable by stale artifacts nobody re-ran it to see
      # (BUILDLOG 2026-08-12).
      - name: MCP acceptance suite
        run: sh spike/mcp-acceptance.sh
        env:
          SIDEEYE_ROOT: ${{ github.workspace }}

      # A sealed campaign whose own artifacts disagree produces verdicts that mean
      # nothing — campaign 2 sealed exactly that and had to be voided (BUILDLOG
      # 2026-08-14). The per-campaign checker existed only inside the campaign that
      # wrote it; this walks every campaign present, requires one, and fails when a
      # campaign seals invocations without carrying it forward.
      - name: Sealed campaigns are internally consistent
        run: sh spike/check-sealed-campaigns.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Unit tests
        run: zig build test --summary all

      - name: Build engine and shim
        run: zig build

      # The demo is also the release workflow's smoke test; macOS is where its
      # no-oracle path lives (a FAIL stands on its own evidence, so the demo needs
      # neither strace nor --allow-unverified). The Linux side is covered by
      # acceptance check 5 in the container.
      - name: sideeye demo finds the planted bug
        run: |
          set +e
          out=$(./zig-out/bin/sideeye demo 2>&1)
          rc=$?
          set -e
          echo "$out" | tail -25
          [ "$rc" = "1" ] || { echo "expected exit 1 from the demo, got $rc"; exit 1; }

      # An Apple-shipped platform binary can never be observed, but *how* it
      # refuses is OS-dependent — measured, not assumed: macOS 15 strips the
      # insertion silently (the run completes, no_shim_marker), while macOS 26's
      # dyld terminates the target over the arm64/arm64e mismatch
      # (recording_run_failed) — so the platform binary pins only the refusal
      # fact, exit 2 and never a verdict. (A hardened-runtime ad-hoc binary was
      # tried as the clause carrier and is OS-dependent in the other direction:
      # macOS 15 ignores the insertion, macOS 26 lets it through.) The prose is
      # therefore pinned on the deterministic synthesis of a missing marker: a
      # decoy dylib that never writes shim_ready, handed to --shim — whether
      # dyld loads it or not, the marker cannot appear, on any OS.
      #
      # What the prose says changed with #391. The line used to name four
      # candidate causes on every macOS refusal, including this one, where the
      # operation is a binary built on the runner seconds earlier and the actual
      # cause is the decoy. So the assertion is now two-sided: the observation
      # that was measured must be present, and the old guess must be ABSENT.
      # A containment-only check would pass against the old build too, which is
      # what the first draft of this step got wrong.
      # Each predicate seen red once (BUILDLOG 2026-08-18, 2026-08-29).
      - name: The macOS refusal keeps its shape, and the clause is pinned
        run: |
          set +e
          d="${RUNNER_TEMP:-/tmp}/platform-binary-pin"
          mkdir -p "$d/state-apple" "$d/state"
          out=$(./zig-out/bin/sideeye explore --state "$d/state-apple" --operation /usr/bin/true --check /usr/bin/true --work "$d/work-apple" --json "$d/report-apple.json" 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out" | head -3
          [ "$rc" = "2" ] || { echo "expected exit 2 from an Apple platform binary, got $rc"; exit 1; }

          printf 'int main(void){return 0;}\n' > "$d/noop.c"
          zig cc -o "$d/noop" "$d/noop.c"
          printf 'int sideeye_decoy;\n' > "$d/decoy.c"
          zig cc -dynamiclib -o "$d/decoy.dylib" "$d/decoy.c"
          set +e
          out=$(./zig-out/bin/sideeye explore --state "$d/state" --operation "$d/noop" --check /usr/bin/true --shim "$d/decoy.dylib" --work "$d/work" --json "$d/report.json" 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out" | head -3
          [ "$rc" = "2" ] || { echo "expected exit 2 when the shim never initialises, got $rc"; exit 1; }
          printf '%s\n' "$out" > "$d/text.out"
          python3 - "$d" <<'EOF'
          import json, sys
          d = sys.argv[1]
          r = json.load(open(d + "/report.json"))
          if r.get("unknown_reason") != "no_shim_marker":
              sys.exit("unknown_reason is %r, wanted no_shim_marker" % r.get("unknown_reason"))
          msg = r.get("message")
          if not isinstance(msg, str):
              sys.exit("the JSON report carries no message: %r" % msg)
          # The operation is a binary this job compiled a moment ago: ad-hoc signed,
          # dynamically linked, nothing on its image keeping a library out. The marker
          # is missing because the shim handed to --shim never writes one.
          if "read before the run started" not in msg:
              sys.exit("the refusal does not say what it read, or when: %r" % msg)
          if "another cause" not in msg:
              sys.exit("the refusal does not place the cause off the image: %r" % msg)
          # The guesses this replaced. Their absence is the half a containment-only
          # assertion would miss, because the old build emitted the first of them on
          # every macOS refusal regardless of the target.
          for guess in ("Apple-shipped platform binary",
                        "statically linked, hardened, or not injected at all"):
              if guess in msg:
                  sys.exit("the refusal still offers a guess it did not measure: %r" % guess)
          text = open(d + "/text.out").read()
          if msg not in text:
              sys.exit("the text report does not carry the JSON message verbatim")
          EOF
          echo "ok   the refusal keeps its shape and states an observation: exit 2, the token, a measured path, no unmeasured guess, JSON message verbatim in the text"

      # No oracle here: SIP leaves DTrace's syscall provider with no probes even as
      # root, and the one candidate measured oracle-shaped, fs_usage, is root-gated
      # (#181, spike/macos-oracle/). That is why this job asserts FAIL rather than PASS
      # — a counterexample is real whether or not the account of the run was complete,
      # while "no counterexample found" would need a completeness check this platform
      # does not provide by default.
      - name: Interposition works and finds the planted bug
        run: |
          set -eu
          mkdir -p /tmp/ci/state
          zig cc -o /tmp/ci/toy-bug -DBUGGY=1 spike/toys/toy.c

          set +e
          out=$(./zig-out/bin/sideeye explore \
            --state /tmp/ci/state \
            --setup "/tmp/ci/toy-bug init" \
            --operation "/tmp/ci/toy-bug rotate" \
            --shim "$PWD/zig-out/lib/libsideeye_shim.dylib" \
            --work /tmp/ci/work \
            --allow-unverified 2>&1)
          rc=$?
          set -e

          echo "$out"
          [ "$rc" = "1" ] || { echo "expected FAIL (exit 1), got $rc"; exit 1; }
          echo "$out" | grep -q "after  unlink" || { echo "crash point not named"; exit 1; }
          echo "$out" | grep -q "before rename" || { echo "next operation not named"; exit 1; }
          echo "$out" | grep -q "NOT VERIFIED" || { echo "weaker claim not labelled"; exit 1; }

      # Contract v8 parity: state writes through re-bound standard descriptors must be
      # counted identically on both platforms (exact numbers, not just the verdict —
      # F_GETPATH is a different resolution mechanism than /proc/self/fd, and the count
      # is where a platform-specific miss would show).
      - name: State writes through dup2'd standard descriptors are counted (v8)
        run: |
          set -eu
          rm -rf /tmp/ci-dup && mkdir -p /tmp/ci-dup/state
          zig cc -o /tmp/ci-dup/toy-fixed spike/toys/toy.c

          set +e
          out=$(TOY_DUP2=1 ./zig-out/bin/sideeye explore \
            --state /tmp/ci-dup/state \
            --setup "/tmp/ci-dup/toy-fixed init" \
            --operation "/tmp/ci-dup/toy-fixed rotate" \
            --shim "$PWD/zig-out/lib/libsideeye_shim.dylib" \
            --work /tmp/ci-dup/work \
            --allow-unverified 2>&1)
          rc=$?
          set -e

          [ "$rc" = "0" ] || { echo "expected PASS, got $rc"; echo "$out" | head -6; exit 1; }
          echo "$out" | grep -q "explored 13 worlds (crash points 12 + 1 baseline)" \
            || { echo "descriptor-borne writes not counted (want 12 + 1, matching Linux)"; echo "$out" | head -4; exit 1; }

      # The shim's own trace descriptor is a number a target can legally close.
      # Below the relocation floor a daemonize-style close sweep must not move the
      # verdict (this also pins that the relocation happened — an unrelocated trace
      # fd sits at 3 and would be swept); a sweep that does reach the channel must
      # end in refusal with the state file holding exactly what the target wrote,
      # never the shim's own trace records (measured on Linux before the guard).
      # kqueue stats as a FIFO on this platform, so TOY_ANONFD also runs here.
      - name: Descriptor hygiene sweeps and anon descriptors (v8)
        run: |
          set -eu
          rm -rf /tmp/ci-fd && mkdir -p /tmp/ci-fd/state
          zig cc -o /tmp/ci-fd/toy-fixed spike/toys/toy.c

          run_toy() {
            set +e
            out=$(env "$1" ./zig-out/bin/sideeye explore \
              --state /tmp/ci-fd/state \
              --setup "/tmp/ci-fd/toy-fixed init" \
              --operation "/tmp/ci-fd/toy-fixed rotate" \
              --shim "$PWD/zig-out/lib/libsideeye_shim.dylib" \
              --work /tmp/ci-fd/work \
              --allow-unverified 2>&1)
            rc=$?
            set -e
          }

          run_toy TOY_CLOSE_SWEEP=150
          [ "$rc" = "0" ] || { echo "sweep below the floor moved the verdict: $rc"; echo "$out" | head -4; exit 1; }
          echo "$out" | grep -q "explored 5 worlds (crash points 4 + 1 baseline)" \
            || { echo "sweep below the floor changed the count"; echo "$out" | head -4; exit 1; }

          rm -rf /tmp/ci-fd/state /tmp/ci-fd/work && mkdir -p /tmp/ci-fd/state
          run_toy TOY_CLOSE_SWEEP=1023
          [ "$rc" = "2" ] || { echo "sweep at the trace fd should refuse, got $rc"; echo "$out" | head -4; exit 1; }
          echo "$out" | grep -q "unresolvable_path" || { echo "refusal did not name the channel"; echo "$out" | head -4; exit 1; }
          printf 'key=2\n' | cmp -s - /tmp/ci-fd/state/key.json \
            || { echo "state file corrupted by the harness:"; od -c /tmp/ci-fd/state/key.json | head -3; exit 1; }

          rm -rf /tmp/ci-fd/state /tmp/ci-fd/work && mkdir -p /tmp/ci-fd/state
          run_toy TOY_ANONFD=1
          [ "$rc" = "0" ] || { echo "a kqueue descriptor moved the verdict: $rc"; echo "$out" | head -4; exit 1; }
          echo "$out" | grep -q "explored 5 worlds (crash points 4 + 1 baseline)" \
            || { echo "kqueue changed the count"; echo "$out" | head -4; exit 1; }

      # The parity claim, asserted rather than described: both platforms must reach the
      # same logical crash point out of the same number of operations.
      - name: Same crash point as Linux
        run: |
          set -eu
          rm -rf /tmp/ci2 && mkdir -p /tmp/ci2/state
          zig cc -o /tmp/ci2/toy-bug -DBUGGY=1 spike/toys/toy.c

          set +e
          out=$(./zig-out/bin/sideeye explore \
            --state /tmp/ci2/state \
            --setup "/tmp/ci2/toy-bug init" \
            --operation "/tmp/ci2/toy-bug rotate" \
            --shim "$PWD/zig-out/lib/libsideeye_shim.dylib" \
            --work /tmp/ci2/work \
            --allow-unverified 2>&1)
          set -e

          echo "$out" | grep -q "crash point 5 of 5" \
            || { echo "expected crash point 5 of 5 (matching Linux)"; echo "$out"; exit 1; }
          echo "$out" | grep -q "explored    6 worlds" \
            || { echo "expected 6 explored worlds (5 + baseline)"; echo "$out"; exit 1; }

      # Run the line the report prints, on the platform where checking it by hand went
      # wrong: the shell still had the variables exported from an earlier experiment, so
      # an inert command appeared to work. A clean `env` cannot be fooled that way.
      - name: The printed reproduce line reproduces
        run: |
          set -eu
          rm -rf /tmp/ci3 && mkdir -p /tmp/ci3/state
          zig cc -o /tmp/ci3/toy-bug -DBUGGY=1 spike/toys/toy.c

          out=$(./zig-out/bin/sideeye explore \
            --state /tmp/ci3/state \
            --setup "/tmp/ci3/toy-bug init" \
            --operation "/tmp/ci3/toy-bug rotate" \
            --shim "$PWD/zig-out/lib/libsideeye_shim.dylib" \
            --work /tmp/ci3/work \
            --allow-unverified 2>&1) || true

          line=$(echo "$out" | grep '^reproduce' | sed 's/^reproduce  *//; s/ <operation>$//')
          [ -n "$line" ] || { echo "no reproduce line printed"; echo "$out"; exit 1; }

          rm -rf /tmp/ci3/state && mkdir -p /tmp/ci3/state
          TOY_STATE=/tmp/ci3/state /tmp/ci3/toy-bug init

          set +e
          # Unquoted deliberately: `env` must receive the VAR=VALUE words separately,
          # exactly as a person pasting the line would.
          env -i TOY_STATE=/tmp/ci3/state $line /tmp/ci3/toy-bug rotate
          rc=$?
          set -e

          [ "$rc" = "137" ] || { echo "expected SIGKILL (137), got $rc"; echo "$line"; exit 1; }
          [ ! -f /tmp/ci3/state/key.json ] || { echo "key.json survived; the kill did not land"; exit 1; }
          [ -f /tmp/ci3/state/key.json.tmp ] || { echo "key.json.tmp missing; not the reported state"; exit 1; }

      # The macOS coverage ratchet (#333): every watched write-capable kernel export
      # is interposed or excused with a reason, both sides parsed from the real
      # artifacts on this runner. Exit 2 is BROKEN (the parse failed), never a pass.
      - name: Every watched write-capable export is interposed or explained (#333)
        run: python3 spike/check-macos-coverage.py shim/src/macos.zig shim/src/darwin_libc.zig

      # The clone family is counted, the swap family refuses, and both are scope-
      # gated (#333, trace contract v12). Six legs over one toy, each asserting the
      # discriminating number rather than "a verdict was reached" — PASS is a verdict
      # too, which is how the first draft of this check could not fail.
      - name: A clone is one counted write; a swap refuses in scope only (v12)
        run: |
          set -eu
          rm -rf /tmp/ci-v12 && mkdir -p /tmp/ci-v12/state
          cat > /tmp/ci-v12/toy.c <<'EOF'
          #include <sys/clonefile.h>
          #include <sys/stdio.h>
          #include <copyfile.h>
          #include <fcntl.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/stat.h>
          #include <unistd.h>
          static const char *sd(void){ return getenv("TOY_STATE"); }
          static int wr(const char*p,const char*c){ int fd=open(p,O_WRONLY|O_CREAT|O_TRUNC,0644); if(fd<0)return -1;
            if(write(fd,c,strlen(c))!=(ssize_t)strlen(c)){close(fd);return -1;} if(fsync(fd)!=0){close(fd);return -1;} close(fd); return 0; }
          int main(int argc,char**argv){
            char dst[4096],src[4096],a[4096],b[4096],out1[4096],out2[4096];
            snprintf(dst,sizeof dst,"%s/cloned.json",sd());
            snprintf(src,sizeof src,"%s/../src.txt",sd());
            snprintf(a,sizeof a,"%s/a.txt",sd());
            snprintf(b,sizeof b,"%s/b.txt",sd());
            snprintf(out1,sizeof out1,"%s/../o1.txt",sd());
            snprintf(out2,sizeof out2,"%s/../o2.txt",sd());
            if(argc<2)return 2;
            if(!strcmp(argv[1],"init")){ mkdir(sd(),0755); unlink(dst);
              if(wr(a,"A\n")||wr(b,"B\n")||wr(out1,"1\n")||wr(out2,"2\n"))return 1; return wr(src,"key=2\n")?1:0; }
            /* C1: the clone must SUCCEED (rc asserted) — a +1 from a failed attempt
               would count the phantom, not the clone. One fsync alongside so the run
               has a second, unrelated operation. */
            if(!strcmp(argv[1],"clone-plus")){ if(clonefile(src,dst,0)!=0){perror("clonefile");return 1;}
              int fd=open(a,O_WRONLY,0); if(fd<0)return 1; if(fsync(fd)!=0){close(fd);return 1;} close(fd); return 0; }
            /* state-twin: the clone FAILS (dst exists, rc asserted nonzero), the
               fallback writes; the attempt is one extra crash point, the verdict moves nowhere. */
            if(!strcmp(argv[1],"failed-clone")){ if(wr(dst,"pre\n"))return 1;
              if(clonefile(src,dst,0)==0){fprintf(stderr,"expected EEXIST\n");return 1;}
              return wr(dst,"key=2\n")?1:0; }
            /* C2: source inside, destination outside — a swapped-argument
               implementation records this; the correct one records nothing. */
            if(!strcmp(argv[1],"clone-out")){ char od[4096]; snprintf(od,sizeof od,"%s/../cl-out.txt",sd());
              unlink(od); if(clonefile(a,od,0)!=0){perror("clonefile out");return 1;}
              int fd=open(out1,O_WRONLY,0); if(fd<0)return 1; if(fsync(fd)!=0){close(fd);return 1;} close(fd); return 0; }
            /* C2, fclonefileat: srcfd INSIDE the state dir, dst a RELATIVE name under
               an outside dirfd. Relative deliberately: an absolute dst makes the
               kernel ignore the dirfd and the swap is invisible (measured in review). */
            if(!strcmp(argv[1],"fclone-out")){ char odir[4096]; snprintf(odir,sizeof odir,"%s/..",sd());
              int sfd=open(a,O_RDONLY,0); if(sfd<0)return 1;
              int dfd=open(odir,O_RDONLY|O_DIRECTORY,0); if(dfd<0){close(sfd);return 1;}
              unlinkat(dfd,"fcl-out.txt",0);
              int rc=fclonefileat(sfd,dfd,"fcl-out.txt",0); close(sfd); close(dfd);
              if(rc!=0){perror("fclonefileat");return 1;}
              int fd=open(out1,O_WRONLY,0); if(fd<0)return 1; if(fsync(fd)!=0){close(fd);return 1;} close(fd); return 0; }
            /* the DATA-path pin: copyfile's visibility rests on Apple binding plain
               _open/_write inside libcopyfile — this leg goes red the day that changes. */
            if(!strcmp(argv[1],"copy-data")){ if(copyfile(src,dst,NULL,COPYFILE_DATA)!=0){perror("copyfile");return 1;} return 0; }
            if(!strcmp(argv[1],"swap")){ return renamex_np(a,b,RENAME_SWAP)?1:0; }
            if(!strcmp(argv[1],"swap-out")){ if(renamex_np(out1,out2,RENAME_SWAP)!=0){perror("renamex_np");return 1;}
              int fd=open(a,O_WRONLY,0); if(fd<0)return 1; if(fsync(fd)!=0){close(fd);return 1;} close(fd); return 0; }
            return 2; }
          EOF
          zig cc -o /tmp/ci-v12/toy /tmp/ci-v12/toy.c

          run_leg() { # mode expected_rc — prints the report, returns engine rc in $rc
            rm -rf /tmp/ci-v12/state /tmp/ci-v12/work "$(dirname /tmp/ci-v12/state)/src.txt" 2>/dev/null || true
            mkdir -p /tmp/ci-v12/state
            set +e
            out=$(./zig-out/bin/sideeye explore \
              --state /tmp/ci-v12/state \
              --setup "/tmp/ci-v12/toy init" \
              --operation "/tmp/ci-v12/toy $1" \
              --shim "$PWD/zig-out/lib/libsideeye_shim.dylib" \
              --work /tmp/ci-v12/work \
              --json /tmp/ci-v12/r.json \
              --allow-unverified 2>&1)
            rc=$?
            set -e
            [ "$rc" = "$2" ] || { echo "leg $1: expected exit $2, got $rc"; echo "$out" | head -6; exit 1; }
          }
          points() { python3 -c 'import json;print(json.load(open("/tmp/ci-v12/r.json"))["crash_points"])'; }

          # C1: clone succeeds and is counted. clone(.write) + open(a) + fsync(a) = 3.
          run_leg clone-plus 0
          [ "$(points)" = "3" ] || { echo "clone-plus: want 3 crash points (clone counted), got $(points)"; exit 1; }

          # state-twin: wr(dst)=3, failed clone attempt=+1, fallback wr(dst)=3 → 7, PASS.
          run_leg failed-clone 0
          [ "$(points)" = "7" ] || { echo "failed-clone: want 7 crash points (attempt counted, verdict intact), got $(points)"; exit 1; }

          # C2: destination outside → the clone is NOT counted. Setup runs BEFORE the
          # initial snapshot, and nothing in scope changes during the operation, so the
          # honest outcome is a PASS over zero crash points — measured, not assumed:
          # the first draft of this leg expected the zero-ops refusal, which needs the
          # snapshots to DIFFER, and they don't here. The discriminating number is the
          # count: a swapped-argument implementation fabricates an in-scope write and
          # answers 1.
          run_leg clone-out 0
          [ "$(points)" = "0" ] || { echo "clone-out: want 0 crash points (out-of-scope clone not counted; nonzero is the argument swap)"; cat /tmp/ci-v12/r.json; exit 1; }

          # C2, fclonefileat with the arguments a swap would misread: srcfd inside,
          # relative dst outside. Correct: 0 crash points. Swapped: srcfd read as a
          # dirfd resolves the dst UNDER state/a.txt — inside scope — and the count
          # goes to 1.
          run_leg fclone-out 0
          [ "$(points)" = "0" ] || { echo "fclone-out: want 0 crash points; a nonzero count here is the argument swap"; cat /tmp/ci-v12/r.json; exit 1; }

          # The DATA-path pin: libcopyfile's plain _open/_write imports keep the copy
          # visible. write(dst) recorded → at least 1 crash point, and a verdict.
          run_leg copy-data 0
          [ "$(points)" -ge 1 ] || { echo "copy-data: the DATA path went dark (Apple import change?)"; exit 1; }

          # The swap refusal, in scope, with the Linux-shaped spelling.
          run_leg swap 2
          grep -q '"unknown_reason": "unsupported_syscall_observed"' /tmp/ci-v12/r.json || { echo "swap: expected the unsupported refusal"; cat /tmp/ci-v12/r.json; exit 1; }
          grep -q 'renamex_np(RENAME_SWAP)' /tmp/ci-v12/r.json || { echo "swap: refusal must name the flag"; cat /tmp/ci-v12/r.json; exit 1; }

          # And OUT of scope the same swap refuses nothing — the scope gate the
          # oracle's refusal has on Linux, kept symmetric here. The run proceeds to a
          # verdict over the in-scope fsync (2 crash points: open(a) write-capable +
          # fsync(a)); an ungated implementation answers exit 2 with the unsupported
          # refusal instead, which is the red this leg exists to show.
          run_leg swap-out 0
          [ "$(points)" = "2" ] || { echo "swap-out: want 2 crash points and a verdict, got $(points)"; cat /tmp/ci-v12/r.json; exit 1; }
          ! grep -q 'unsupported_syscall_observed' /tmp/ci-v12/r.json || {
            echo "swap-out: an out-of-scope swap must not refuse as unsupported"; cat /tmp/ci-v12/r.json; exit 1; }

      - name: "macOS oracle: fs_usage verifies a PASS, catches a missed op, refuses an unseen process (ADR 0031)"
        # The three falsifiable checks from the plan, against a real fs_usage. The
        # runner's sudo is passwordless (measured 27 times in the Route F1 survey,
        # spike/fsusage/RESULTS.md), which is what lets a root-only observer be
        # exercised in CI at all. The script builds first, so the binary under test is
        # the source under test.
        run: bash spike/fsusage/acceptance-local.sh


  # The timewarrior finding lives here as a replayed regression, not a recipe (#82):
  # every push to main and every pull request re-proves the FAIL/PASS pair across the fix — record the counterexample
  # on the pinned unpatched build, replay it FAIL, rebuild with the committed patch,
  # replay it PASS. Either leg alone can rot silently (a FAIL-only check cannot tell
  # "the bug is real" from "the replay is broken"; a PASS-only check cannot tell
  # "fixed" from "case no longer applies"), which is why the pair is the job.
  #
  # Scope, stated plainly: this is regression HYGIENE, not v1.0 criterion-1 progress —
  # ADR 0017's ordering requirement keeps the timewarrior finding at "discovered
  # automatically — partial", and #82's older amendment definitions are superseded by
  # that ADR. The novelty record for the finding is BUILDLOG 2026-08-12 (linked, not
  # restated). The exploration this job performs is not a #84 corpus trial — that
  # corpus is frozen, and check 12 counts trials from its own manifest.
  #
  # A future trace-contract bump does not break this job: the script re-records the
  # case under the new contract each run (the committed-case alternative would have
  # gone red instead). If legs go red, the script's own output carries the exit code
  # and unknown_reason — enough to tell apparatus breakage from a real regression.

  timew-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build engine and shim
        run: zig build

      - name: Install the toolchain the pinned timewarrior build needs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git ca-certificates cmake g++ make python3 strace

      - name: "Replay across the fix: record, FAIL unpatched, PASS patched (legs a-c)"
        run: LEGS=abc sh spike/dogfood-timew-replay.sh
        env:
          SIDEEYE_REPO: ${{ github.workspace }}

  # The development journal is a delivery artifact here, and it went unwritten for four
  # pull requests once because nothing asked for it. Now something asks: a PR that
  # changes code without touching BUILDLOG.md does not merge. The decision logic was
  # shown its red against a synthetic code-only changeset before being trusted.
  buildlog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changed code requires a BUILDLOG entry
        run: |
          # Three-dot: diff from the merge-base, so a base branch that moved ahead does
          # not smuggle its own file list into this PR's changed set.
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          printf 'changed files:\n%s\n' "$changed"
          if echo "$changed" | grep -qE '^(src/|shim/|spike/|build\.zig$|build\.zig\.zon$)'; then
            if ! echo "$changed" | grep -qx 'BUILDLOG.md'; then
              echo '::error::This PR changes code but not BUILDLOG.md.'
              echo 'BUILDLOG.md is the running decision log (newest first, "## YYYY-MM-DD — claim").'
              echo 'Write the entry before the PR: what was decided, what was measured, what went wrong.'
              exit 1
            fi
          fi
          echo 'ok: BUILDLOG requirement satisfied'

  # The language bar is a claim about what this repository is, and it was wrong three
  # times: the rule said "register a record when its campaign closes" and nothing read
  # .gitattributes at the moment one closed (ADR 0021). The direction is inverted now,
  # and this holds it — over every tracked file under spike/, reading the attribute
  # rather than the text, because a pattern can be syntactically fine and semantically
  # dead. Its own job: it needs no toolchain, so a failure here is unambiguous.
  classification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every file under spike/ is classified, and the two directions hold
        run: sh spike/check-gitattributes.sh

  # ADR numbers are allocated as "the highest existing number plus one", which
  # reserves nothing. On 2026-08-27 two sessions each wrote a docs/adr/0028-*.md;
  # the slugs differed, so git merged both without a conflict and only the two
  # sessions telling each other noticed (#373). Its own job for the same reason
  # as the one above: no toolchain, so a failure here names the allocation and
  # nothing else. What it can and cannot do is written on the script — it reports
  # a collision that reached main, and cannot stop the merge that creates one,
  # because no status check is required on this repository.
  adr-numbering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First, because a green from a check that cannot go red says nothing. The
      # uniqueness pass is a pipeline with no `set -e` behind it: break its sed and
      # a directory holding a real duplicate reports every number unique (measured).
      - name: The check proves it can go red
        run: sh spike/check-adr-numbering.sh --selftest

      - name: ADR numbers are unique
        run: sh spike/check-adr-numbering.sh

  # The onboarding clock's audit is criterion 6's instrument: it decides whether a
  # timed run's evidence stands. Until 2026-08-28 nothing here ran it — the launcher
  # ran its selftest, and runs are rare, so a broken instrument could sit on main for
  # weeks and surface only when someone burned a box on it. Its own job for the same
  # reason as the one above: no toolchain, so a failure here names the instrument and
  # nothing else.
  onboarding-clock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The clock's audit still holds its own predicates
        run: python3 spike/onboarding-clock/clock-audit.py --selftest

      # --selftest returns before the argument handling, the file writes and the
      # exit codes, which is the half the launcher depends on. This drives the
      # real entry point twice and reads what it wrote. The `ok` fixture carries
      # BOTH an off-allowlist call and a legitimate box invocation, so exactly one
      # finding is the assertion that the scoped `Bash(...)` spec still reduces to
      # the name `Bash` — if it stopped reducing there would be two.
      - name: The clock's audit holds its exit codes and its policy wiring end to end
        run: |
          set -eu
          d=$(mktemp -d)
          mon='{"timestamp":"T1","type":"assistant","message":{"content":[{"type":"tool_use","id":"m","name":"Monitor","input":{"command":"echo off-allowlist"}}]}}'
          box='{"timestamp":"T2","type":"assistant","message":{"content":[{"type":"tool_use","id":"b","name":"Bash","input":{"command":"docker exec onboarding-box true"}}]}}'
          printf '%s\n%s\n' "$mon" "$box" > "$d/ok.jsonl"
          printf '%s\n%s\nbroken {\n' "$mon" "$box" > "$d/broken.jsonl"
          audit() {
            rc=0
            python3 spike/onboarding-clock/clock-audit.py \
              --transcript "$1" --outdir "$d" --cli-version ci --prompt-sha x \
              --agent-rc 0 --repo-root "$PWD" --target-version v \
              --allowed 'Bash(docker exec onboarding-box *),Read,Edit,Write,Glob,Grep' \
              --disallowed 'WebFetch,WebSearch,Task' \
              --launch-started-at T0 || rc=$?
            echo "exit=$rc"
          }
          # Read the JSON rather than grepping it: a count of `"kind"` lines is a
          # count of occurrences of a word, and a tool input carrying its own
          # `kind` key would inflate it. One physical line on purpose — a
          # multi-line `python3 -c` here cannot be indented (module statements
          # start at column 0) and so escapes this block scalar, which broke the
          # workflow file in a way the shell alone could not show.
          expect() {
            python3 -c "import json,sys; m=json.load(open('$d/meta.json')); n=len(m['audit_void'])+len(m['audit_adjudicate']); t=sorted({f['tool'] for f in m['audit_void']+m['audit_adjudicate']}); print('verdict=%s findings=%d tools=%s' % (m['verdict'], n, t)); sys.exit(0 if (m['verdict']=='$1' and n==$2) else 'expected verdict $1 with $2 finding(s)')"
          }
          audit "$d/ok.jsonl"
          test "$rc" = 0 || { echo '::error::an auditable run must exit 0'; exit 1; }
          expect 'needs adjudication' 1 \
            || { echo '::error::the scoped Bash spec may have stopped reducing to a name — a legitimate box call would then be flagged too'; exit 1; }
          grep -q '"tool": "Monitor"' "$d/meta.json"
          audit "$d/broken.jsonl"
          test "$rc" != 0 || { echo '::error::a transcript with an unreadable line must not exit 0'; exit 1; }
          expect 'unauditable' 1
          echo 'ok: the real entry point holds its exit codes, its policy wiring and its writes'
