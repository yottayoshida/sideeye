name: release

# Attaches prebuilt binaries + shim to every GitHub Release (#75). Three native
# runners rather than one cross-compiling machine: a cross-built artifact cannot be
# run where it was built, and the smoke test below — `sideeye demo` must find the
# planted bug, exit 1 — is the point of building natively. The shim travels in every
# tarball; it is half the product, and the inventory check refuses to ship without it.
#
# Triggers:
#   release published  — the manual ceremony (tag -> gh release create) is the origin;
#                        assets attach to the release that was just published. The
#                        ceremony then verifies this workflow went green and the assets
#                        exist (gh release view) before announcing anything.
#   workflow_dispatch  — the recovery path: re-builds, and uploads when a tag is named,
#                        so a published release that lost its assets can be repaired.
#   pull_request       — build-only proof of the matrix, for PRs touching this file.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload assets to (empty = build only)"
        required: false
        default: ""
  pull_request:
    paths:
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: x86_64-linux
            target: x86_64-linux-gnu.2.28
            shim: libsideeye_shim.so
          - runner: ubuntu-24.04-arm
            artifact: aarch64-linux
            target: aarch64-linux-gnu.2.28
            shim: libsideeye_shim.so
          - runner: macos-latest
            artifact: aarch64-macos
            target: aarch64-macos
            shim: libsideeye_shim.dylib
    runs-on: ${{ matrix.runner }}
    steps:
      # A dispatch that names a tag builds *that tag*, not the default branch: a repair
      # run that rebuilt current main and uploaded it under the old tag's name would
      # attach an artifact whose content is not the tag's (R1 finding). On a release
      # event the default checkout is already the tag; on a PR it is the merge ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # -Dtarget is spelled even where it equals the runner's own platform: a bare
      # native build compiles for the *builder's* CPU features, and the aarch64-linux
      # artifacts of v0.9.0 and v0.10.0 shipped with the Graviton runner's extensions
      # baked in — Illegal instruction on any lesser CPU (Apple-Silicon Docker,
      # measured 2026-08-17). An explicit target pins the baseline CPU for the
      # architecture. The smoke test below still runs on the builder's CPU only —
      # it proves the artifact pair works, not that every CPU can run it; the pin
      # is what carries that.
      #
      # The glibc version is spelled too (#161): the artefact's requirement is capped by the
      # triple rather than by whatever the toolchain defaults to that month — 2.31 on Zig
      # 0.16.0, against the 2.28 the artefacts actually use. The version is a CEILING, not a
      # gate: where the symbol a build wants has an older entry point, Zig links that one and
      # the requirement simply drops (measured — `.2.27` and `.2.17` both build, at 2.27 and
      # 2.17). A symbol with nothing at or below the pin has no fallback and does fail the
      # build, which is the only shape that turns a versioned build red — and the reason CI
      # builds this triple too. 2.28 is the smallest value that leaves today's pair untouched and the only one equal to
      # what the pair requires; below it the
      # shim's own requirement set moves, and which libc entry points the shim resolves is an
      # observation-surface question, not a packaging one.
      - name: Build (ReleaseSafe, baseline CPU)
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      # The tag and the binary are two spellings of one version, and they have drifted
      # before (0.1.0 vs 0.1.0-dev). A tarball whose binary disagrees with its own
      # name must not ship. Runs whenever a tag is in play — release events and
      # tag-named dispatches alike; a PR build has no tag to hold the binary against.
      - name: Version matches the tag
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          REL_TAG: ${{ github.event_name == 'release' && github.ref_name || inputs.tag }}
        run: |
          got=$(./zig-out/bin/sideeye version)
          case "$got" in
            "sideeye ${REL_TAG#v} "*) echo "ok: $got" ;;
            *) echo "::error::binary says '$got', tag says '$REL_TAG'"; exit 1 ;;
          esac

      # The packaged pair has to work on the OS it ships for. The demo compiles the
      # embedded toy with the runner's C compiler and explores it through the shim it
      # just found next to the binary: exit 1 — the planted bug — is the only success.
      # This is also the one place the ReleaseSafe build is exercised rather than
      # only compiled; the acceptance suite runs Debug.
      - name: Smoke test the artifact pair (sideeye demo)
        run: |
          set +e
          out=$(./zig-out/bin/sideeye demo 2>&1)
          rc=$?
          set -e
          echo "$out" | tail -30
          [ "$rc" = "1" ] || { echo "::error::expected exit 1 (FAIL, planted bug found), got $rc"; exit 1; }

      # The shim ships inside a tarball and is also what a package manager
      # installs. Homebrew rewrote this dylib's install name to an absolute path
      # under its own prefix (it has exceptions, but none that this library
      # qualifies for); without padding in the Mach-O header the longer name
      # does not fit, and `brew install` reported "Failed to fix install
      # linkage" and exited 1 on a build that otherwise ran. sideeye's own
      # lookup does not notice, because it finds the shim by real path and
      # injects that path.
      #
      # Seen red once, on the real artifact rather than a synthetic one:
      # v0.12.0's released dylib fails this exact check (its name stays
      # @rpath/libsideeye_shim.dylib), which is the measurement that produced
      # the build flag this step guards.
      #
      # install_name_tool prints that failure on stderr and STILL EXITS 0, so
      # the assertion is on the resulting install name, never on a status.
      #
      # Scope, so a later reader does not over-read a green: `otool -D | tail -1`
      # reads one install name, which is right for the thin artifact this matrix
      # builds (-Dtarget=aarch64-macos) and would read only the last slice of a
      # universal binary. A malformed dylib, a missing install name or an absent
      # tool also fail here, and the error text below names the likely cause
      # rather than the only one.
      #
      # Delete this step when the shim stops shipping as a dylib, or when the
      # release stops building a macOS target.
      - name: The shipped macOS shim can be relocated by a package manager
        if: matrix.artifact == 'aarch64-macos'
        run: |
          set -eu
          # A copy: rewriting the real file would ship a dylib carrying a
          # package manager's path as its identity.
          probe=/tmp/shim-relocate-probe.dylib
          long=/opt/homebrew/opt/sideeye/lib/libsideeye_shim.dylib
          cp "zig-out/lib/${{ matrix.shim }}" "$probe"
          before=$(otool -D "$probe" | tail -1)
          install_name_tool -id "$long" "$probe" 2> /tmp/relocate.err || true
          after=$(otool -D "$probe" | tail -1)
          echo "install name: $before -> $after"
          [ "$after" = "$long" ] || {
            echo "::error::the shipped shim's install name did not become '$long' (it is '$after'); the usual cause is a build without headerpad_max_install_names, and install_name_tool's own message follows"
            cat /tmp/relocate.err
            exit 1
          }

      - name: Package
        env:
          REL_TAG: ${{ github.event_name == 'release' && github.ref_name || inputs.tag }}
        run: |
          set -eu
          tagv="${REL_TAG:-dev}"
          name="sideeye-$tagv-${{ matrix.artifact }}"
          mkdir -p "dist/$name"
          cp zig-out/bin/sideeye "dist/$name/"
          cp "zig-out/lib/${{ matrix.shim }}" "dist/$name/"
          cp LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # Checked against an expected inventory before anything is uploaded: a
          # tarball without the shim is half the product, silently.
          tar -tzf "dist/$name.tar.gz" | sed "s|^$name/||" | grep -v '^$' | sort > got.txt
          printf '%s\n' "LICENSE-APACHE" "LICENSE-MIT" "${{ matrix.shim }}" "sideeye" | sort > want.txt
          diff -u want.txt got.txt || { echo "::error::tarball contents differ from the expected inventory"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: sideeye-${{ matrix.artifact }}
          path: dist/*.tar.gz
          if-no-files-found: error

  upload:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.ref_name || inputs.tag }}
        run: |
          set -eu
          ls -la dist
          gh release upload "$TAG" dist/*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
