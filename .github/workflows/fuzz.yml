name: fuzz

# ADR 0112. Never on pull_request: a new seed's finding must not turn an unrelated change red.

on:
  schedule:
    - cron: '41 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Fuzz every entry point from this run's seed
        run: |
          echo "seed ${{ github.run_id }}, 200000 runs per entry point; reproduce with: zig build fuzz -Dfuzz-seed=${{ github.run_id }} -Dfuzz-runs=200000"
          zig build fuzz --summary all -Dfuzz-seed=${{ github.run_id }} -Dfuzz-runs=200000

      - name: Keep the input a failed or hung run left behind
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ github.run_id }}
          path: /tmp/sideeye-fuzz-*/input.bin
          if-no-files-found: warn
