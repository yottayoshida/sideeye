name: JevFuzz Action smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# This synthetic campaign checks the Action integration, not Sideeye's behavior.
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: yottayoshida/jevfuzz@6ec5acbf16801620fdef6b646d082def91b4dfee # JevFuzz main, 2026-09-24 (Action not release-tagged)
        with:
          command: plan
          target: .jevfuzz/campaign.json
