# Revision 1 (after the result of ../kubectl): the operation's image named by absolute path, the
# one change a user makes when the refusal says Sideeye did not resolve it. Nothing else differs.
[world]
state = "/s/kubectl"

[define]
operation = "/opt/bin/kubectl config use-context b --kubeconfig /s/kubectl/config"
check     = "/ap/defines/kubectl-r1/check.sh"
