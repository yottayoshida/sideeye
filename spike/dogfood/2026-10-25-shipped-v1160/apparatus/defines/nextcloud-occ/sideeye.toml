[world]
state = "/s/ncconf"

[define]
# Adding a trusted domain to a Nextcloud instance's system configuration with its admin CLI. The state
# is the configuration directory only (NEXTCLOUD_CONFIG_DIR, env.sh): config.php holds the instance's
# secret, password salt and database settings. The data directory (SQLite in WAL mode, the log) stays
# outside it, in the box's /opt/nc-data.
operation = "php /opt/nextcloud/occ config:system:set trusted_domains 1 --value=cloud.example.com"
check     = "/s/nc-check.sh"
cwd       = "/s/ncconf"
