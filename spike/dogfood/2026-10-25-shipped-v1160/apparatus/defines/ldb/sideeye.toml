[world]
state = "/s/rdb"

[define]
# One key overwritten. The open that serves it replays the previous run's log into a table file,
# rolls the MANIFEST and writes a new OPTIONS file, each through a temporary name and a rename.
operation = "ldb --db=/s/rdb --try_load_options put k1 changed"
# RocksDB's info log, which carries the time on every line.
scratch   = ["LOG"]
check     = "/s/rdb-check.sh"
cwd       = "/s"
