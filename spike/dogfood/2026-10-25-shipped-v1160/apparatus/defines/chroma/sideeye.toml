[world]
# A Chroma persistent directory: chroma.sqlite3 (collections, documents, metadata, the write-ahead
# log of embeddings) and one HNSW segment directory.
state = "/s/chroma"

[define]
# The interpreter first: `chroma` is a Python script (#!/opt/chroma/bin/python3.13).
operation = "/opt/chroma/bin/python3.13 /opt/chroma/bin/chroma vacuum --path /s/chroma --force"
check     = "/s/chroma-check.sh"
cwd       = "/s"
