; The Gogs instance the 2026-10-25 set-2 define restores into: SQLite, no network service needed.
BRAND_NAME = Gogs
RUN_USER   = root
RUN_MODE   = prod

[database]
TYPE = sqlite3
PATH = data/gogs.db

[repository]
ROOT = repositories

[server]
DOMAIN    = localhost
HTTP_PORT = 3000
EXTERNAL_URL = http://localhost:3000/
APP_DATA_PATH = data
OFFLINE_MODE = true

[security]
INSTALL_LOCK = true
SECRET_KEY   = set2-fixed-secret-key

[log]
MODE = file
LEVEL = Info
ROOT_PATH = /s/gogsaux/log

[picture]
DISABLE_GRAVATAR = true
