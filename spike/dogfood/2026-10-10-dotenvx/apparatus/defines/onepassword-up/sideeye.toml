# D3 measured: 1password up stores the key in 1Password (a stand-in op), reads it back, records where, then removes it from .env.keys
[world]
state = "/s/kc"

[define]
operation = "dotenvx 1password up -f /s/kc/.env"
cwd       = "/s/kc"
check     = "/ap/defines/onepassword-up/check.sh"
# New key pairs, ciphertext and stand-in stores in every run; the checker finds the key wherever it is.
scratch   = [".env", ".env.keys", "keyring.json", "keyring.json.tmp", "op.json", "op.json.tmp", "config"]
