[world]
state = "/s/git/state"

[define]
# The original define, with the automatic gc and maintenance off: the detached child they start is
# what wrote .git/gc.pid.lock (child_touched_state_dir, 2026-10-02). The commit itself is unchanged.
operation = "git -c gc.auto=0 -c maintenance.auto=false -C /s/git/state commit -q -m second"
cwd       = "/s/git/state"
check     = "/ap/defines/git-nogc-scratch2/check.sh"
# COMMIT_EDITMSG added: docs/cli.md names it among the paths nobody depends on, and the first form
# of this define FAILed on it alone (transcripts/explore/git-nogc-scratch), the checker passing in all 39 worlds.
scratch   = [".git/index", ".git/COMMIT_EDITMSG"]
