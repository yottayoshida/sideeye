[world]
state = "/s/sq"

[define]
operation = ["sqlite3", "/s/sq/ledger.db", "BEGIN; UPDATE accounts SET bal = bal - 30 WHERE id = 'A'; UPDATE accounts SET bal = bal + 30 WHERE id = 'B'; INSERT INTO journal(src, dst, amt) VALUES('A', 'B', 30); COMMIT;"]
# The database and its rollback journal are left torn by design and repaired by SQLite on the next
# open; their correctness is the checker's, read after that open.
scratch   = ["ledger.db", "ledger.db-journal"]
check     = "/s/sq-aux/check.sh"
