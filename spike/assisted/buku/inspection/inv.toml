# Investigation copy of the committed buku-add define (spike/assisted/buku/ops/
# buku-add.toml): same state, same setup, same operation, but the checker is
# an instrumented copy that dumps each visited world's on-disk state to
# /inv/worlds.log before applying the committed checker's own logic.
[world]
state = "/tmp/assisted/buku/state"

[define]
setup           = "/work/spike/assisted/buku/ops/setup.sh"
operation       = "/usr/bin/buku --nostdin --np --tacit --add https://example.com/x ada --title AdaMark"
check           = "/inv/check.sh"
expected_status = "0"
