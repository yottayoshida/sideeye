# Seal B artifact (ADR 0012): the declared topydo configuration for every
# operation except revert. One deviation from defaults, documented:
#
#   backup_count = 0 — "Set to 0 to disable backups." (ConfigBackupCount
#   tiddler, config-default 5). Reason: the backup store is rewritten on
#   every modification (Backups tiddler) and its listing prints times at
#   second precision (observed via `revert ls`, transcripts/normal-runs.txt;
#   the backup bytes themselves were never read). Sideeye's un-killed
#   baseline world must reproduce the recorded final state byte-for-byte,
#   so this is a pre-registered refusal risk (the watson precedent) — one
#   this config removes for these operations rather than measures, because
#   measuring it would mean running the engine over the target before the
#   seal. The cost is stated in declaration.md: these operations' crash
#   surface is todo.txt/done.txt only, and the backup subsystem is probed
#   through the revert operation alone.
[topydo]
backup_count = 0
