# Seal B artifact (ADR 0012): the declared topydo configuration for every
# operation except revert. One deviation from defaults, documented:
#
#   backup_count = 0 — "Set to 0 to disable backups." (ConfigBackupCount
#   tiddler, config-default 5). Reason: the backup store carries times at
#   second precision (observed via `revert ls`, transcripts/normal-runs.txt),
#   and sideeye's un-killed baseline world must reproduce the recorded final
#   state byte-for-byte. With backups on, every operation would be refused as
#   baseline_violates_invariant for the timestamp alone (the watson precedent),
#   not for anything topydo does wrong. The cost is stated in declaration.md:
#   these operations' crash surface is todo.txt/done.txt only, and the backup
#   subsystem is probed through the revert operation alone.
[topydo]
backup_count = 0
